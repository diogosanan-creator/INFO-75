<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento para Impressão</title>
  <style>
    :root {
      --green: #1b6db0;
      --green-deep: #143d73;
      --cyan: #46d3d7;
      --ink: #112033;
      --muted: #657489;
      --line: #cfdae8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #edf3fb, #f7fbff);
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      padding: 18px 24px 0;
      background: linear-gradient(180deg, rgba(237, 243, 251, 0.95), rgba(237, 243, 251, 0));
    }

    .print-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green-deep), var(--green), var(--cyan));
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(20, 61, 115, 0.2);
    }

    .print-shell {
      padding: 24px;
    }

    .empty-state {
      max-width: 720px;
      margin: 64px auto;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 18px 36px rgba(17, 32, 51, 0.08);
    }

    @media print {
      .print-toolbar {
        display: none;
      }

      body {
        background: #fff;
      }

      .print-shell {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="print-toolbar">
    <button class="print-action" id="printPdfButton" type="button">🖨️ Imprimir PDF</button>
  </div>
  <main class="print-shell" id="printRoot">
    <article class="empty-state">
      <h1>Documento indisponível</h1>
      <p>Abra este documento a partir do sistema para carregar o conteúdo correto.</p>
    </article>
  </main>
  <script src="./print.js"></script>
</body>
</html>
