<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento para Impressão</title>
  <style>
    :root {
      --green: #1b6db0;
      --green-deep: #143d73;
      --cyan: #46d3d7;
      --ink: #112033;
      --muted: #657489;
      --line: #cfdae8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      margin: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: Inter, Arial, sans-serif;
      font-size: clamp(13px, 3.5vw, 15px);
      color: var(--ink);
      background: linear-gradient(180deg, #edf3fb, #f7fbff);
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px 0;
      background: linear-gradient(180deg, rgba(237, 243, 251, 0.95), rgba(237, 243, 251, 0));
    }

    .print-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green-deep), var(--green), var(--cyan));
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(20, 61, 115, 0.2);
    }

    .print-shell {
      padding: 12px;
      width: 100%;
      max-width: 100%;
    }

    .empty-state {
      max-width: 100%;
      margin: 32px auto;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 18px 36px rgba(17, 32, 51, 0.08);
    }

    /* ── Sheet wrapper (printDoc documents) ── */
    .sheet {
      width: 100%;
      max-width: 100%;
      padding: 0;
      margin: 0 auto;
      font-family: Inter, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #dff7ff, transparent 26%),
                  linear-gradient(180deg, #edf3fb, #f7fbff);
    }

    /* Hero banner */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0b2341 0%, #143d73 46%, #1b6db0 78%, #46d3d7 100%);
      color: #fff;
      box-shadow: 0 16px 36px rgba(17, 32, 51, 0.18);
      overflow: hidden;
      word-wrap: break-word;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 16px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(18px, 5vw, 26px);
      letter-spacing: 0.05em;
      word-break: break-word;
    }

    .brand p,
    .hero-note p,
    .hero-note span {
      margin: 0;
      color: rgba(255, 255, 255, 0.8);
      font-size: clamp(11px, 3vw, 13px);
    }

    .hero-note {
      display: grid;
      gap: 6px;
      text-align: right;
      min-width: 0;
    }

    .hero-note strong {
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d9fafe;
    }

    /* Content area */
    .content {
      margin-top: 14px;
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(233, 248, 255, 0.94));
      box-shadow: 0 12px 28px rgba(17, 32, 51, 0.08);
    }

    .content-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .doc-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan-soft, #e9fbff), #ffffff);
      border: 1px solid rgba(27, 109, 176, 0.14);
      color: var(--green-deep);
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .doc-title {
      font-size: clamp(12px, 3vw, 14px);
      color: var(--muted);
      text-align: right;
      word-break: break-word;
    }

    /* Meta grid — stacks to 1 column on narrow screens */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .box,
    .section {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff, #f5fbff);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      word-wrap: break-word;
    }

    .box h2,
    .section h2 {
      margin: 0 0 10px;
      font-size: clamp(10px, 2.8vw, 12px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    .box p,
    .section p {
      margin: 0 0 6px;
      line-height: 1.5;
      font-size: clamp(12px, 3.2vw, 14px);
    }

    /* Tables */
    .table-card {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      width: 100%;
      max-width: 100%;
    }

    table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: clamp(11px, 3vw, 13px);
    }

    thead {
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #fff;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    tbody tr:nth-child(even) {
      background: #f4f8fe;
    }

    tbody tr {
      page-break-inside: avoid;
    }

    /* Split layout — stacks on mobile */
    .split-note {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .mini-panel {
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff, #f4fbff);
      border: 1px solid var(--line);
    }

    .mini-panel h3 {
      margin: 0 0 8px;
      font-size: clamp(10px, 2.8vw, 12px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    .mini-panel p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
      font-size: clamp(12px, 3vw, 13px);
    }

    .total-card {
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--green-deep), var(--green), var(--cyan));
      border: 1px solid var(--green-deep);
      text-align: right;
      color: #fff;
      box-shadow: 0 14px 28px rgba(20, 61, 115, 0.18);
    }

    .total-card span {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: clamp(10px, 2.8vw, 12px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .total-card strong {
      display: block;
      margin-top: 6px;
      font-size: clamp(22px, 6vw, 28px);
      color: #fff;
    }

    .accent-rule {
      height: 6px;
      margin: 14px 0 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green-deep), var(--green), var(--cyan));
    }

    .footer {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: clamp(11px, 2.8vw, 12px);
    }

    .footer strong {
      color: var(--green-deep);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ── Mobile breakpoint ── */
    @media (max-width: 600px) {
      .print-shell {
        padding: 8px;
      }

      .hero {
        padding: 16px 12px;
        border-radius: 14px;
      }

      .brand img {
        width: 52px;
        height: 52px;
      }

      .hero-note {
        text-align: left;
      }

      .content {
        padding: 12px;
        border-radius: 14px;
      }

      .box,
      .section {
        padding: 12px;
        border-radius: 12px;
      }

      .table-card {
        border-radius: 12px;
      }

      th, td {
        padding: 8px;
        font-size: 11px;
      }

      .total-card {
        padding: 14px;
        border-radius: 12px;
      }

      .mini-panel {
        padding: 12px;
        border-radius: 12px;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm 12mm;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        background: #fff !important;
        color: #000 !important;
        font-size: 10pt;
      }

      .print-toolbar {
        display: none !important;
      }

      .print-shell {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      /* Sheet wrapper from printDoc() */
      .sheet {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        background: none !important;
      }

      /* Hero banner — preserve gradient colours */
      .hero {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 14pt 12pt !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .brand img {
        width: 52pt !important;
        height: 52pt !important;
      }

      .brand h1 {
        font-size: 18pt !important;
      }

      /* Content area */
      .content {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 10pt !important;
        background: none !important;
      }

      .meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 8pt !important;
      }

      .box, .section {
        border-radius: 0 !important;
        padding: 8pt !important;
        box-shadow: none !important;
        background: #fff !important;
      }

      /* Tables */
      .table-card {
        border-radius: 0 !important;
        overflow: visible !important;
      }

      table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
      }

      th, td {
        font-size: 9pt !important;
        padding: 5pt 6pt !important;
        word-break: break-word !important;
        overflow-wrap: break-word !important;
      }

      tbody tr {
        page-break-inside: avoid !important;
      }

      /* Split layout — stack vertically on print */
      .split-note {
        grid-template-columns: 1fr !important;
        gap: 8pt !important;
      }

      /* Total card — preserve gradient */
      .total-card {
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 10pt !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .total-card strong {
        font-size: 18pt !important;
      }

      /* Accent rule — preserve gradient */
      .accent-rule {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Footer */
      .footer {
        font-size: 8pt !important;
        flex-wrap: wrap !important;
        gap: 4pt !important;
      }

      /* Images from visit photos */
      img {
        max-width: 100% !important;
        height: auto !important;
      }

      h1 { font-size: 16pt !important; }
      h2 { font-size: 12pt !important; page-break-after: avoid; }
      h3 { font-size: 10pt !important; page-break-after: avoid; }
    }
  </style>
</head>
<body>
  <div class="print-toolbar">
    <button class="print-action" id="printPdfButton" type="button">🖨️ Imprimir PDF</button>
  </div>
  <main class="print-shell" id="printRoot">
    <article class="empty-state">
      <h1>Documento indisponível</h1>
      <p>Abra este documento a partir do sistema para carregar o conteúdo correto.</p>
    </article>
  </main>
  <script src="./print.js"></script>
</body>
</html>
