<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- ── Icon badge ── -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="url(#badgeGrad)"/>

  <!-- Circuit traces — horizontal -->
  <line x1="8"  y1="60" x2="30" y2="60" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="60" x2="112" y2="60" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Circuit traces — vertical -->
  <line x1="60" y1="8"  x2="60" y2="30"  stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="60" y2="112" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corner L-traces -->
  <polyline points="30,40 30,30 40,30" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="80,30 90,30 90,40" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,80 30,90 40,90" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="80,90 90,90 90,80" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Node dots -->
  <circle cx="30" cy="60" r="3.5" fill="#dcfce7"/>
  <circle cx="90" cy="60" r="3.5" fill="#dcfce7"/>
  <circle cx="60" cy="30" r="3.5" fill="#dcfce7"/>
  <circle cx="60" cy="90" r="3.5" fill="#dcfce7"/>

  <!-- Central "i" letterform -->
  <circle cx="60" cy="40" r="7" fill="#ffffff"/>
  <rect x="53" y="52" width="14" height="28" rx="4" fill="#ffffff"/>

  <!-- Accent bar inside badge -->
  <rect x="28" y="88" width="64" height="4" rx="2" fill="url(#barGrad)" opacity="0.9"/>

  <!-- ── Wordmark ── -->
  <!-- "INFO75" brand name -->
  <text
    x="130" y="56"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="900"
    fill="#111827"
    letter-spacing="1"
  >INFO<tspan fill="#16a34a">75</tspan></text>

  <!-- Separator line -->
  <rect x="130" y="64" width="338" height="2.5" rx="1.25" fill="url(#barGrad)"/>

  <!-- Full company name on one line -->
  <text
    x="131" y="84"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="700"
    fill="#374151"
    letter-spacing="2"
  >ASSESSORIA E ASSISTÊNCIA DE INFORMÁTICA</text>

  <!-- Tagline -->
  <text
    x="131" y="101"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    font-weight="400"
    fill="#6b7280"
    letter-spacing="1.2"
  >Soluções em TI · Manutenção · Suporte Técnico</text>
</svg>
